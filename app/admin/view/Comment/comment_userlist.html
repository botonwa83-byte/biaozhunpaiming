{extend name="Public/base" /}
{block name="main-content"}
	<div class="page-content">
		<div class="row">
			<div class="col-xs-12">
				<div>
					<form id="alldel" name="alldel" method="post" action="{:url('commentAlldel')}" >
						<input name="p" id="p" value="{:request()->param('p')}" type="hidden" />
						<div class="table-responsive">
							<table class="table table-striped table-bordered table-hover" id="dynamic-table">
								<thead>
								<tr>
									<th>ID</th>
									<th>评论人</th>
									<th>头像</th>
								</tr>
								</thead>

								<tbody>

								{foreach name="userlists" item="v"}
									<tr>
										<td width="10">{$v.id}</td>
										<td width="30">{$v.username}</td>
										<td width="30"><img width="30" src="http://47.94.199.232/images/{$v['id']}.jpg"/></td>
									</tr>
								{/foreach}
								<tr>
									<td colspan="8" align="left" class="hidden-xs">{$page}</td>
									<td colspan="8" align="left" class="hidden-lg hidden-md hidden-sm"></td>
								</tr>
								</tbody>
							</table>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div><!-- /.page-content -->
{/block}
