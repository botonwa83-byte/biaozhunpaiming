{extend name="Public/base" /}
{block name="main-content"}
	<div class="page-content">
		<div class="row">
			<div class="col-xs-12">
				<div>
					<form class="form-horizontal ajaxForm2" id="add" name="form0" method="post" action="{:url('addComment')}" >
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 类型：  </label>
							<input type="radio" name="type" value="1" checked required/> 文章&nbsp;&nbsp;&nbsp;&nbsp;
							<input type="radio" name="type" value="2" required/> 投票
							<hr/>
						</div>

						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> ID：  </label>
							<input type="text" name="post_id" id="post_id"  placeholder="ID"  required/>
							<hr/>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 评论内容：  </label>
							<div class="col-sm-10">
							<textarea name="content[]" id="content_1"  placeholder="评论内容"  class="col-xs-10 col-sm-6" ></textarea>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 评论内容：  </label>
							<div class="col-sm-10">
							<textarea name="content[]" id="content_2"  placeholder="评论内容"  class="col-xs-10 col-sm-6" ></textarea>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 评论内容：  </label>
							<div class="col-sm-10">
							<textarea name="content[]" id="content_3"  placeholder="评论内容"  class="col-xs-10 col-sm-6" ></textarea>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 评论内容：  </label>
							<div class="col-sm-10">
							<textarea name="content[]" id="content_4"  placeholder="评论内容"  class="col-xs-10 col-sm-6" ></textarea>
							</div>
						</div>
						<div class="form-group">
							<label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 评论内容：  </label>
							<div class="col-sm-10">
							<textarea name="content[]" id="content_5"  placeholder="评论内容"  class="col-xs-10 col-sm-6" ></textarea>
							</div>
						</div>
						<div class="col-md-offset-3 col-md-9">
							<button class="btn btn-info" type="submit">
								<i class="ace-icon fa fa-check bigger-110"></i>
								保存
							</button>&nbsp; &nbsp; &nbsp;
							<button class="btn" type="reset">
								<i class="ace-icon fa fa-undo bigger-110"></i>
								重置
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div><!-- /.page-content -->
{/block}
