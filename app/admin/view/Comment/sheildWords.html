{extend name="Public/base" /}
{block name="main-content"}
	<div class="page-content">
		<div class="row">
			<div class="col-xs-12 col-sm-1">
				<button class="btn btn-xs btn-danger" data-toggle="modal" data-target="#myModal">
					<i class="ace-icon fa fa-bolt bigger-110"></i>
					添加屏蔽词
				</button>
			</div>
			<div class="col-xs-12">
				<div>
					<form id="alldel" name="alldel" method="post" action="{:url('commentAlldel')}" >
						<input name="p" id="p" value="{:request()->param('p')}" type="hidden" />
						<div class="table-responsive">
							<table class="table table-striped table-bordered table-hover" id="dynamic-table">
								<thead>
								<tr>
									<th>ID</th>
									<th>屏蔽词</th>
									<th class="hidden-xs">审核</th>
									<!-- <th style="border-right:#CCC solid 1px;">操作</th> -->
								</tr>
								</thead>

								<tbody>

								{foreach name="data" item="v"}
									<tr>
										<td width="10">{$v.id}</td>
										<td width="30">{$v.content}</td>
										<td width="80" class="hidden-sm hidden-xs">{$v.createtime|date='Y-m-d H:i:s',###}</td>
										<!-- <td width="50">
											<div class="action-buttons">
												<a class="red confirm-rst-url-btn" data-info="你确定要删除吗？" href="{:url('commentDel',array('id'=>$v['id'],'p'=>request()->param('p')))}" title="删除">
													<i class="ace-icon fa fa-trash-o bigger-130"></i>
												</a>
											</div>
										</td> -->
									</tr>
								{/foreach}
								<tr>
									<td align="left"><button id="btnsubmit" class="btn btn-white btn-yellow btn-sm" >删</button> </td>
									<td colspan="8" align="right" class="hidden-xs">{$page}</td>
									<td colspan="8" align="right" class="hidden-lg hidden-md hidden-sm"></td>
								</tr>
								</tbody>
							</table>
						</div>
					</form>
				</div>
			</div>
			<!-- 显示模态框（Modal） -->
			<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
				<form class="form-horizontal ajaxForm2" name="ad_add" method="post" action="{:url('sheildWords')}">
					<div class="modal-dialog" style="width:1000px;">
						<div class="modal-content">
							<div class="modal-header">
								<button type="button" class="close" data-dismiss="modal"
										aria-hidden="true">×
								</button>
								<h4 class="modal-title" id="myModalLabel">
									添加屏蔽词
								</h4>
							</div>
							<div class="modal-body">
								<div class="row">
									<div class="col-xs-12">
										<div class="form-group">
											<label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 屏蔽词名称：  </label>
											<div class="col-sm-11">
												<input type="text" name="content" id="content" placeholder="输入广告名称" class="col-xs-10 col-sm-5" required/>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="modal-footer">
								<button type="submit" class="btn btn-primary">
									提交保存
								</button>
								<button class="btn btn-info" type="reset">
									重置
								</button>
								<button type="button" class="btn btn-default" data-dismiss="modal">
									关闭
								</button>
							</div>
						</div><!-- /.modal-content -->
					</div><!-- /.modal-dialog -->
				</form>
			</div><!-- /.modal -->
		</div>
	</div><!-- /.page-content -->
{/block}
