{extend name="Public/base" /}
{block name="main-content"}
    <div class="page-content">
        <!--主题-->
        <div class="page-header">
            <h1>
                您当前操作
                <small>
                    <i class="ace-icon fa fa-angle-double-right"></i>
                    修改
                </small>
            </h1>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <form class="form-horizontal ajaxForm2" name="form0" method="post" action="{:url('runedit')}"  enctype="multipart/form-data">
                    <input type="hidden" name="id" id="id" value="{$data.id}" />
                    <div class="space-4"></div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 热名称：  </label>
                        <div class="col-sm-10">
                            <input type="text" name="label" id="label" value="{$data.label}"  placeholder="必填：热名称"  class="col-xs-10 col-sm-6" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 链接：  </label>
                        <div class="col-sm-10">
                            <input type="text" name="href" id="href" value="{$data.href}" placeholder="必填：热描述"  class="col-xs-10 col-sm-6" required/>
                        </div>
                    </div>

                    <div class="space-4"></div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right red" for="form-field-1"> 是否审核： </label>
                        <div class="col-sm-10" style="padding-top:5px;">
                            <input name="status" id="status" value="1" {$data.status==1?'checked':''} class="ace ace-switch ace-switch-4 btn-flat" type="checkbox" />
                            <span class="lbl">&nbsp;&nbsp;默认否</span>
                        </div>
                    </div>
                    <div class="space-4"></div>
                    <div class="clearfix form-actions">
                        <div class="col-md-offset-3 col-md-9">
                            <button class="btn btn-info" type="submit">
                                <i class="ace-icon fa fa-check bigger-110"></i>
                                保存
                            </button>&nbsp; &nbsp; &nbsp;
                            <button class="btn" type="reset">
                                <i class="ace-icon fa fa-undo bigger-110"></i>
                                重置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div><!-- /.page-content -->
{/block}
