{extend name="Public/base" /}
{block name="main-content"}
	<div class="page-content">
		<a class="btn btn-xs" href="javascript:history.back(-1)">
			<i class="ace-icon fa fa-bolt bigger-110"></i>
			企业名称列表
		</a>
		<button class="btn btn-xs btn-danger" data-toggle="modal" data-target="#myModal">
			<i class="ace-icon fa fa-bolt bigger-110"></i>
				添加分数
		</button>
		<link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/sldate/daterangepicker-bs3.css" />
		<div class="row">
			<div class="col-xs-12">
				<div>
					<form id="listorder" name="listorder" method="post" action="{:url('listorder')}" >
						<input name="p" id="p" value="{:request()->param('p',1)}" type="hidden" />
						<div class="table-responsive">
							<table class="table table-striped table-bordered table-hover" id="dynamic-table">
								<thead>
								<tr>
									<th class="hidden-xs">月份</th>
									<th class="hidden-xs">企业名称名</th>
									<th class="hidden-xs">得分</th>
									<th style="border-right:#CCC solid 1px;">操作</th>
								</tr>
								</thead>
								<tbody>
								{foreach name="data" item="v"}
									<tr>
										<td class="hidden-xs" align="center">{$v.month}月</td>
										<td class="hidden-xs" align="center">{$brand['brand_name']}</td>
										<td class="hidden-xs">{$v.score}</td>
										<td class="hidden-xs">
											<div class="hidden-xs action-buttons">
												<a class="green" href="{:url('scoreEdit',array('id'=>$v['id']))}" title="修改">
													<i class="ace-icon fa fa-pencil bigger-130"></i>
												</a>
												<a class="red confirm-rst-url-btn" data-info="你确定要删除到回收站吗？" href="{:url('delScore',array('id'=>$v['id'],'p'=>request()->param('p',1)))}" title="回收站">
													<i class="ace-icon fa fa-trash-o bigger-130"></i>
												</a>
											</div>
											<div class="hidden-md hidden-lg">
												<div class="inline position-relative">
													<button class="btn btn-minier btn-primary dropdown-toggle" data-toggle="dropdown" data-position="auto">
														<i class="ace-icon fa fa-cog icon-only bigger-110"></i>
													</button>
													<ul class="dropdown-menu dropdown-only-icon dropdown-yellow dropdown-menu-right dropdown-caret dropdown-close">
														<li>
															<a href="{:url('edit',array('id'=>$v['id']))}" class="tooltip-success" data-rel="tooltip" title="" data-original-title="修改">
																<span class="green">
																	<i class="ace-icon fa fa-pencil-square-o bigger-120"></i>
																</span>
															</a>
														</li>

														<li>
															<a href="{:url('del',array('id'=>$v['id'],'p'=>request()->param('p',1)))}" data-info="你确定要删除到回收站吗？" class="tooltip-error confirm-rst-url-btn" data-rel="tooltip" title="" data-original-title="回收站">
																<span class="red">
																	<i class="ace-icon fa fa-trash-o bigger-120"></i>
																</span>
															</a>
														</li>
													</ul>
												</div>
											</div>
										</td>
									</tr>
								{/foreach}
								<tr>
									<td align="left"><button type="submit" class="btn btn-white btn-yellow btn-sm">排序</button> </td>
									<td colspan="8" align="right" class="hidden-xs">{$page}</td>
									<td colspan="8" align="right" class="hidden-lg hidden-md hidden-sm">{$page_min}</td>
								</tr>
								</tbody>
							</table>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
		<form class="form-horizontal ajaxForm2" name="add" method="post" action="{:url('runScoreAdd')}">
			<div class="modal-dialog" style="width:1000px;">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal"
								aria-hidden="true">×
						</button>
						<h4 class="modal-title" id="myModalLabel">
							添加排行榜
						</h4>
					</div>
					<div class="modal-body">
						<div class="row">
							<div class="col-xs-12">
								<input type="hidden" name="brand_id" value="{:request()->param('id')}">
								<div class="form-group">
									<label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 月份：  </label>
									<div class="col-sm-11">
										<select name="month"  class="col-sm-4 selector" required>
											<option value="">请选择月份</option>
											{for  start="1" end="13"}
												<option value="{$i}">{$i}月</option>
											{/for}
										</select>
									</div>
								</div>
								<div class="form-group">
									<label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 分数： </label>
									<div class="col-sm-11">
										<input type="text" name="score" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" id="form-field-10">
									</div>
								</div>
                                <div class="form-group">
                                    <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色分数计算公式： </label>
                                    <div class="col-sm-11">
                                        <textarea name="score_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder=""></textarea>
                                    </div>
                                </div>
								<div class="form-group">
									<label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 是否审核： </label>
									<div class="col-sm-11" style="padding-top:5px;">
										<input name="status" id="ad_status" value="1" class="ace ace-switch ace-switch-4 btn-flat" type="checkbox" />
										<span class="lbl">&nbsp;&nbsp;默认关闭</span>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="submit" class="btn btn-primary">
							提交保存
						</button>
						<button class="btn btn-info" type="reset">
							重置
						</button>
						<button type="button" class="btn btn-default" data-dismiss="modal">
							关闭
						</button>
					</div>
				</div>
			</div>
		</form>
	</div>
{/block}
{block name="scripts"}
	<script type="text/javascript" src="__PUBLIC__/sldate/moment.js"></script>
	<script type="text/javascript" src="__PUBLIC__/sldate/daterangepicker.js"></script>
    <script type="text/javascript">
        $('#reservation').daterangepicker(null, function (start, end, label) {
            console.log(start.toISOString(), end.toISOString(), label);
        });
    </script>
{/block}
