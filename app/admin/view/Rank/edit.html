{extend name="Public/base" /}
{block name="main-content"}
    <div class="page-content">
        <div class="page-header">
            <h1>
                您当前操作
                <small>
                    <i class="ace-icon fa fa-angle-double-right"></i>
                    修改排行榜信息
                </small>
            </h1>
        </div>
        <form class="form-horizontal ajaxForm2" name="ad_add" method="post" action="{:url('edit')}">
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="form-group">
                        <input type="hidden" value="{$rank.id}" name="id">
                        <div class="form-group">
                            <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 排行榜名称：  </label>
                            <div class="col-sm-11">
                                <input type="text" value="{$rank.rank_name}" name="rank_name" id="rank_name" placeholder="输入广告名称" class="col-xs-10 col-sm-5" required/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 排行榜描述：  </label>
                            <div class="col-sm-11">
                                <textarea type="text" name="desc" id="desc" class="col-xs-10 col-sm-5" required>{$rank.desc}</textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 得分数据更新月份：  </label>
                            <div class="col-sm-11">
                                <input type="text" value="{$rank.month}" name="month" id="month" placeholder="得分数据更新月份" class="col-xs-10 col-sm-5" required/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 数量显示修改：  </label>
                            <div class="col-sm-11">
                                <input type="text" value="{$rank.number}" name="number" id="number" placeholder="数量显示" class="col-xs-10 col-sm-5" required/>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="clearfix form-actions">
                <div class="col-md-offset-3 col-md-9">
                    <button class="btn btn-info" type="submit">
                        <i class="ace-icon fa fa-check bigger-110"></i>
                        保存
                    </button>

                    &nbsp; &nbsp; &nbsp;
                    <button class="btn" type="reset">
                        <i class="ace-icon fa fa-undo bigger-110"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
    </div>
    </div>
{/block}
{block name="scripts"}
    <script>
        $("#plug_ad_checkjsid").click(function(){
            $("#pic_jslist").show();
            $("#pic_list").hide();
            $("#pic_listurl").hide();
        });
        $("#plug_ad_checkid").click(function(){
            $("#pic_jslist").hide();
            $("#pic_list").show();
            $("#pic_listurl").show();
        });
    </script>
{/block}
