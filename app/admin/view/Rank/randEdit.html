{extend name="Public/base" /}
{block name="main-content"}
    <div class="page-content">
        <div class="page-header">
            <h1>
                您当前操作
                <small>
                    <i class="ace-icon fa fa-angle-double-right"></i>
                    修改排行榜信息
                </small>
            </h1>
        </div>
        <a class="btn btn-xs" href="javascript:history.back(-1)">
            <i class="ace-icon fa fa-bolt bigger-110"></i>
            企业名称列表
        </a>
        <form class="form-horizontal ajaxForm2" name="ad_add" method="post" action="{:url('randEdit')}">
            <div class="modal-body">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="form-group">
                        <input type="hidden" value="{$brand.id}" name="id">
                        <div class="form-group">
                            <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 名称：  </label>
                            <div class="col-sm-11">
                                <input type="text" value="{$brand.brand_name}" name="brand_name" id="brand_name" placeholder="输入公司名称" class="col-xs-10 col-sm-5" required/>
                            </div>
                        </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色建筑面积：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.area}" name="area" id="area" placeholder="输入绿色建筑面积" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色建筑面积计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="area_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.area_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 存货周转率：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.times}" name="times" id="times" placeholder="输入存货周转率" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 存货周转率计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="times_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.times_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 毛利率：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.profit}" name="profit" id="profit" placeholder="输入毛利率" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 毛利率计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="profit_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.profit_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 资产负债率：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.liabilities}" name="liabilities" id="liabilities" placeholder="输入资产负债率" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 资产负债率计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="liabilities_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.liabilities_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 现金比率：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.cash}" name="cash" id="cash" placeholder="输入现金比率" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 现金比率计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="cash_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.cash_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 土地储备倍数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.land}" name="land" id="land" placeholder="输入土地储备倍数" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 土地储备倍数计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="land_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.land_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色信用指数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.exponent}" name="exponent" id="exponent" placeholder="输入绿色信用指数" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色信用指数计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="exponent_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.exponent_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色信用等级：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.level}" name="level" id="level" placeholder="输入绿色信用等级" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色信用等级计算公式： </label>
                                <div class="col-sm-11">
                                    <textarea name="level_str" cols="20" rows="5" class="col-xs-10 col-sm-8 limitedone" placeholder="">{$brand.level_str}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--//////////////二期开始--------------------------//////////-->
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色建筑设计系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.sj_coeff}" name="sj_coeff" id="sj_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色建筑运行系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.yx_coeff}" name="yx_coeff" id="yx_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 污染气体排放系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.wr_coeff}" name="wr_coeff" id="wr_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 温室气体排放系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.ws_coeff}" name="ws_coeff" id="ws_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 废弃物排放系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.fq_coeff}" name="fq_coeff" id="fq_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 水资源消耗情况：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.szy_coeff}" name="szy_coeff" id="szy_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 装配式建筑系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.zp_coeff}" name="zp_coeff" id="zp_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 全装修成品房系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.zxc_coeff}" name="zxc_coeff" id="zxc_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 高星级绿色建筑奖励系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.gxj_coeff}" name="gxj_coeff" id="gxj_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 环境信息披露系数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.hjxx_coeff}" name="hjxx_coeff" id="hjxx_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12">
                        <div class="form-group">
                            <div class="form-group">
                                <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 绿色信用指数：  </label>
                                <div class="col-sm-11">
                                    <input type="text" value="{$brand.lxy_coeff}" name="lxy_coeff" id="lxy_coeff" placeholder="" class="col-xs-10 col-sm-5" required/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--//////////////二期结束--------------------------//////////-->
                </div>
                <div class="clearfix form-actions">
                    <div class="col-md-offset-3 col-md-9">
                        <button class="btn btn-info" type="submit">
                            <i class="ace-icon fa fa-check bigger-110"></i>
                            保存
                        </button>
                        <button class="btn" type="reset">
                            <i class="ace-icon fa fa-undo bigger-110"></i>
                            重置
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
{/block}
{block name="scripts"}
    <script>
        $("#plug_ad_checkjsid").click(function(){
            $("#pic_jslist").show();
            $("#pic_list").hide();
            $("#pic_listurl").hide();
        });
        $("#plug_ad_checkid").click(function(){
            $("#pic_jslist").hide();
            $("#pic_list").show();
            $("#pic_listurl").show();
        });
    </script>
{/block}
