{extend name="Public/base" /}
{block name="main-content"}
    <div class="page-content">
        <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/jquery.datetimepicker.css" />
        <script type="text/javascript" src="__PUBLIC__/js/webuploader.js"></script>
        <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/webuploader.css" />
        <!--主题-->
        <div class="page-header">
            <h1>
                您当前操作
                <small>
                    <i class="ace-icon fa fa-angle-double-right"></i>
                    添加报告
                </small>
            </h1>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <form class="form-horizontal ajaxForm2" name="form0" method="post" action="{:url('runadd')}" enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 报告标题： </label>
                        <div class="col-sm-10">
                            <input type="text" name="report_name" placeholder="必填：报告标题" class="col-xs-10 col-sm-6" required />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 页数： </label>
                        <div class="col-sm-10">
                            <input type="text" name="report_page" placeholder="必填：页数" class="col-xs-10 col-sm-6" required />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 图表： </label>
                        <div class="col-sm-10">
                            <input type="text" name="report_chart" placeholder="必填：图表" class="col-xs-10 col-sm-6" required />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 报告时间： </label>
                        <div class="col-sm-10">
                            <input type="text" name="report_time" placeholder="必填：报告时间" class="col-xs-10 col-sm-6" required />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 价格： </label>
                        <div class="col-sm-2">
                            <input type="radio" name="report_price_status" checked value="1" />免费<br/>
                            <input type="radio" name="report_price_status" value="2" />面议<br/>
                            <input type="radio" name="report_price_status" value="3" />收费<br/>
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"><input type="text" value="概述"  name="report_desc_name"></label>
                        <div class="col-sm-10">
                            <textarea name="report_desc" placeholder="必填：概述" class="col-xs-10 col-sm-6" required></textarea>
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"><input type="text" value="目录"  name="report_catalog_name"></label>
                        <div class="col-sm-6">
                            <script src="__PUBLIC__/ueditor/ueditor.config.js" type="text/javascript"></script>
                            <script src="__PUBLIC__/ueditor/ueditor.all.js" type="text/javascript"></script>
                            <textarea name="report_content" rows="100%" style="width:100%;height: 300px;" id="myEditor"></textarea>
                            <script type="text/javascript">
                                var editor = new UE.ui.Editor();
                                editor.render("myEditor");
                            </script>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"><input type="text" value="作者"  name="report_author_name"></label>
                        <div class="col-sm-10">
                            <textarea name="report_author" placeholder="必填：作者" class="col-xs-10 col-sm-6" required></textarea>
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right red" for="form-field-1"> 报告上传： </label>
                        <div class="col-sm-10">
                            <a href="javascript:;" class="file">
                                <input type="file" name="report_file"/>
                                选择上传文件
                            </a>
                        </a>
                        <span class="lbl red">&nbsp;&nbsp;文件上传需一定时间<br /></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right red" for="form-field-1"> 封面图片上传： </label>
                        <div class="col-sm-10">
                            <a href="javascript:;" class="file">
                                <input type="file" name="smeta" id="file0" />
                                选择上传文件
                            </a>
                            <span class="lbl">&nbsp;&nbsp;<img src="__PUBLIC__/img/no_img.jpg" width="100" height="70" id="img0" ></span>&nbsp;&nbsp;<a href="javascript:;" onClick="return backpic('__PUBLIC__/img/no_img.jpg');" title="还原修改前的图片" class="file">
                            撤销上传
                        </a>
                        <span class="lbl">&nbsp;&nbsp;上传前先用PS处理成等比例图片后上传，最后都统一比例<br /></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 相关报告： </label>
                        <div class="col-sm-10">
                            <input type="text" name="report_ids" class="col-xs-10 col-sm-6" placeholder="1,2,3" />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle red" id="resone">多个用英文逗号分开</span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 是否审核： </label>
                        <div class="col-sm-10" style="padding-top:5px;">
                            <input name="status" id="status" value="1" class="ace ace-switch ace-switch-4 btn-flat" type="checkbox"/>
                            <span class="lbl">&nbsp;&nbsp;默认关闭</span>
                        </div>
                    </div>
                    <div class="clearfix form-actions">
                        <div class="col-md-offset-3 col-md-9">
                            <button class="btn btn-info" type="submit"><i class="ace-icon fa fa-check bigger-110"></i>提交</button>&nbsp; &nbsp; &nbsp;
                            <button class="btn" type="reset"><i class="ace-icon fa fa-undo bigger-110"></i>重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{/block}
{block name="scripts"}
    <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/jquery.datetimepicker.css" />
    <script type="text/javascript" src="__PUBLIC__/sldate/moment.js"></script>
    <script type="text/javascript" src="__PUBLIC__/js/jquery.datetimepicker.full.min.js"></script>
    <script type="text/javascript">
        $.datetimepicker.setLocale('zh');
        $('#datetimepicker').datetimepicker({
            dayOfWeekStart : 1,
            lang:'zh',
            disabledDates:[],
            startDate:  ''
        });
        $('.btn-option-add').click(function(){
            var html = '<div class="form-group"><input class="col-sm-2 control-label no-padding-right" name="other_name[]"/><div class="col-sm-10"><textarea name="other_ids[]" placeholder="必填：多个相关文章ID" class="col-xs-10 col-sm-6" ></textarea><span class="help-inline col-xs-12 col-sm-7"><span class="middle red" id="resone">英文逗号隔开</span></span></div></div>';
            $(this).closest('.form-group').before(html);
        });
    </script>
{/block}
