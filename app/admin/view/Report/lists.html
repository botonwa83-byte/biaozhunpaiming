{extend name="Public/base" /}
{block name="main-content"}
<div class="page-content">
	<div class="row maintop">
		<div class="col-xs-12 col-sm-3">
			<form name="admin_list_sea" class="form-search" method="post" action="{:url('lists')}">
				<div class="input-group">
					<span class="input-group-addon">
						<i class="ace-icon fa fa-check"></i>
					</span>
					<input type="text" name="key" id="key" class="form-control search-query admin_sea" value="" placeholder="输入报告名称" />
					<span class="input-group-btn">
						<button type="submit" class="btn btn-xs  btn-purple">
							<span class="ace-icon fa fa-search icon-on-right bigger-110"></span>
							搜索
						</button>
					</span>
				</div>
			</form>
		</div>
		<div class="input-group-btn">
			<a href="{:url('lists')}">
				<button type="button" class="btn btn-xs  btn-purple">
					<span class="ace-icon fa fa-globe icon-on-right bigger-110"></span>
					显示全部
				</button>
			</a>
		</div>
	</div>
	<div class="row">
		<div class="col-xs-12">
			<div>
				<form class="ajaxForm" name="allorder" method="post" action="{:url('order')}" >
					<table class="table table-striped table-bordered table-hover" id="dynamic-table">
						<thead>
						<tr>
							<th class="hidden-xs">ID</th>
							<th>报告名称</th>
							<th class="hidden-sm hidden-xs">添加时间</th>
							<th>点击</th>
							<th>状态</th>
							<th style="border-right:#CCC solid 1px;">操作</th>
						</tr>
						</thead>
						<tbody>
						{foreach name="lists" item="v"}
							<tr>
								<td class="hidden-xs" height="28" >{$v.id}</td>
								<td><a href="" target="_blank">{$v.report_name}</a></td>
								<td class="hidden-sm hidden-xs">{$v.createtime|date='Y-m-d',###}</td>
								<td>{$v.report_hits}</td>
								<td>
									{if condition='$v.status eq 1'}
										<a class="green open-btn" href="{:url('adState')}" data-id="{$v.id}" title="隐藏">
											<div id="zt{$v.id}"><button class="btn btn-minier btn-yellow">显示</button></div>
										</a>
									{else/}
										<a class="red open-btn" href="{:url('adState')}" data-id="{$v.id}" title="隐藏">
											<div id="zt{$v.id}"><button class="btn btn-minier btn-danger">隐藏</button></div>
										</a>																			
									{/if}													
								</td>
								<td>
									<div class="hidden-sm hidden-xs action-buttons">
									<a class="green"  href="{:url('edit',array('id'=>$v['id']))}" title="修改">
									<i class="ace-icon fa fa-pencil bigger-130"></i>
									</a>
									<a class="red confirm-rst-url-btn" href="{:url('ad_del',array('id'=>$v['id'],'p'=>request()->param('p')))}" data-info="你确定要删除吗？" title="删除">
									<i class="ace-icon fa fa-trash-o bigger-130"></i></a>			
									</div>
									<div class="hidden-md hidden-lg">
										<div class="inline position-relative">
											<button class="btn btn-minier btn-primary dropdown-toggle" data-toggle="dropdown" data-position="auto">
												<i class="ace-icon fa fa-cog icon-only bigger-110"></i>
											</button>
											<ul class="dropdown-menu dropdown-only-icon dropdown-yellow dropdown-menu-right dropdown-caret dropdown-close">
												<li>
													<a href="{:url('edit',array('id'=>$v['id']))}" class="tooltip-success" data-rel="tooltip" title="" data-original-title="修改">
													<span class="green">
													<i class="ace-icon fa fa-pencil bigger-120"></i>
													</span>
													</a>
												</li>
												<li>
													<a href="{:url('ad_del',array('id'=>$v['id'],'p'=>request()->param('p')))}"  class="tooltip-error confirm-rst-url-btn" data-info="你确定要删除吗？" data-rel="tooltip" title="" data-original-title="删除">
													<span class="red">
													<i class="ace-icon fa fa-trash-o bigger-120"></i>
													</span>
													</a>
												</li>
											</ul>
										</div>
									</div>
								</td>
							</tr>
						{/foreach}
						<tr>
							<td height="50" align="left"><button  id="btnorder" class="btn btn-white btn-yellow btn-sm">排序</button></td>
							<td height="50" colspan="7" align="right">{$page}</td>
						</tr>
						</tbody>
					</table>
				</form>
			</div>
		</div>
	</div>
	</div>
{/block}
