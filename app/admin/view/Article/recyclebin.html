{extend name="Public/base" /}
{block name="main-content"}
	<div class="page-content">
		<link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/sldate/daterangepicker-bs3.css" />

		<div class="row">
			<div class="col-xs-12">
				<div>
					<form id="alldel" name="alldel" method="post" action="{:url('news_alldel')}" >
						<input name="p" id="p" value="{:request()->param('p',1)}" type="hidden" />
						<div class="table-responsive">
							<table class="table table-striped table-bordered table-hover" id="dynamic-table">
								<thead>
								<tr>
									<th class="hidden-xs center">
										<label class="pos-rel">
											<input type="checkbox" class="ace"  id='chkAll' onclick='CheckAll(this.form)' value="全选"/>
											<span class="lbl"></span>															</label>											</th>
									<th class="hidden-xs">ID</th>
									<th>文章标题</th>
									<th class="hidden-sm hidden-xs">所属栏目</th>
									<th class="hidden-sm hidden-xs">文章属性</th>
									<th class="hidden-xs">点击</th>
									<th class="hidden-xs">发布时间</th>
									<th style="border-right:#CCC solid 1px;">操作</th>
								</tr>
								</thead>

								<tbody>

								{foreach name="posts" item="v"}
									<tr>
										<td class="hidden-xs" align="center">
											<label class="pos-rel">
												<input name='tid[]' id="navid" class="ace"  type='checkbox' value='{$v.tid}'>
												<span class="lbl"></span>
											</label>
										</td>
										<td class="hidden-xs" align="center">{$v.tid}</td>
										<td><a href="{:url('home/articles/detail',['id'=>$v.tid])}" target="_blank" title="{$v.post_title}">{$v.post_title}</a></td>
										<td class="hidden-sm hidden-xs"></td>
										<td class="hidden-sm hidden-xs"></td>
										<td class="hidden-xs">{$v.post_hits}</td>
										<td class="hidden-xs">{$v.post_modified|date='Y-m-d',###}</td>
										<td>
											<div class="action-buttons">
												<a class="red confirm-rst-url-btn" data-info="你确定要还原文章到文章列表吗？" href="{:url('backOpen',array('id'=>$v['tid'],'p'=>request()->param('p',1)))}" title="还原">
													<i class="ace-icon fa fa-check bigger-130"></i>																</a>
												<a class="red confirm-rst-url-btn" data-info="你确定要彻底删除文章吗？" href="{:url('news_back_del',array('id'=>$v['tid'],'p'=>request()->param('p',1)))}" title="删除">
													<i class="ace-icon fa fa-close bigger-130"></i>																</a>												</div>
											<div class="hidden-md hidden-lg hidden-sm hidden-xs">
												<div class="inline position-relative">
													<button class="btn btn-minier btn-primary dropdown-toggle" data-toggle="dropdown" data-position="auto">
														<i class="ace-icon fa fa-cog icon-only bigger-110"></i>
													</button>
													<ul class="dropdown-menu dropdown-only-icon dropdown-yellow dropdown-menu-right dropdown-caret dropdown-close">
														<li>
															<a href="{:url('backOpen',array('id'=>$v['tid'],'p'=>request()->param('p',1)))}" class="tooltip-success confirm-rst-url-btn" data-info="你确定要还原文章到文章列表吗？" data-rel="tooltip" title="" data-original-title="还原">
																			<span class="green">
																				<i class="ace-icon fa fa-check bigger-120"></i>
																			</span>
															</a>
														</li>

														<li>
															<a href="{:url('news_back_del',array('id'=>$v['tid'],'p'=>request()->param('p',1)))}"  class="tooltip-error confirm-rst-url-btn" data-info="你确定要彻底删除文章吗？" data-rel="tooltip" title="" data-original-title="删除">
																			<span class="red">
																				<i class="ace-icon fa fa-close bigger-120"></i>
																			</span>
															</a>
														</li>
													</ul>
												</div>
											</div>
										</td>
									</tr>
								{/foreach}
								<tr>
									<td align="left"></td>
									<td colspan="8" align="right" class="hidden-xs">{$page}</td>
									<td colspan="8" align="right" class="hidden-lg hidden-md hidden-sm">{}</td>
								</tr>
								</tbody>
							</table>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div><!-- /.page-content -->
{/block}
{block name="scripts"}
	<script type="text/javascript" src="__PUBLIC__/sldate/moment.js"></script>
	<script type="text/javascript" src="__PUBLIC__/sldate/daterangepicker.js"></script>
	<script type="text/javascript">
		$('#reservation').daterangepicker(null, function (start, end, label) {
			console.log(start.toISOString(), end.toISOString(), label);
		});
	</script>
{/block}
