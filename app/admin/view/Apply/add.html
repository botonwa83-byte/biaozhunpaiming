{extend name="Public/base" /}
{block name="main-content"}
    <div class="page-content">
        <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/jquery.datetimepicker.css" />
        <!--主题-->
        <div class="page-header">
            <h1>
                您当前操作
                <small>
                    <i class="ace-icon fa fa-angle-double-right"></i>
                    添加报名
                </small>
            </h1>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <form class="form-horizontal ajaxForm2" name="form0" method="post" action="{:url('runadd')}" enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 报名名称： </label>
                        <div class="col-sm-10">
                            <input type="text" name="title" placeholder="必填：报名名称" class="col-xs-10 col-sm-6" required/>
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right" for="form-field-1"> 报名描述 </label>
                        <div class="col-sm-5">
                            <script src="__PUBLIC__/ueditor/ueditor.config.js" type="text/javascript"></script>
                            <script src="__PUBLIC__/ueditor/ueditor.all.js" type="text/javascript"></script>
                            <textarea name="content" rows="100%" style="width:100%;height: 300px;" id="myEditor"></textarea>
                            <script type="text/javascript">
                                var editor = new UE.ui.Editor();
                                editor.render("myEditor");
                            </script>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right">添加链接（名称）</label>
                        <div class="col-sm-10">
                            <input type="text" name="link_name" value=""/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right">添加链接（个数）</label>
                        <div class="col-sm-10">
                            <input type="text" name="links" value=""/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right">报名信息</label>
                        <div class="col-sm-10">
                            <input type="text" style="width: 400px;" name="apply_title"  placeholder=""/><br>
                            <label for="caseName">
                                <input type="checkbox" name="apply_case[caseName]" id="caseName" value="姓名"> 姓名
                            </label>
                            <label for="caseMobile">
                                <input type="checkbox" name="apply_case[caseMobile]" id="caseMobile" value="手机号"> 手机号
                            </label>
                            <label for="caseEmail">
                                <input type="checkbox" name="apply_case[caseEmail]" id="caseEmail" value="E-mail"> E-mail
                            </label>
                            <label for="caseAddress">
                                <input type="checkbox" name="apply_case[caseAddress]" id="caseAddress" value="地址"> 地址
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label name="help_info" class="col-sm-2 control-label no-padding-right">帮助说明</label>
                        <div class="col-sm-10">
                            <textarea class="col-sm-6"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right">选项编辑</label>
                        <div class="col-sm-10">
                            <input type="text" name="options[1][name]"  placeholder="选项1"/>
                            <input type="radio" name="options[1][case]" value="0" checked>单行输入
                            <input type="radio" name="options[1][case]" value="1">多行输入
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"></label>
                        <div class="col-sm-10">
                            <input type="text" name="options[2][name]"  placeholder="选项2"/>
                            <input type="radio" name="options[2][case]" value="0" checked>单行输入
                            <input type="radio" name="options[2][case]" value="1">多行输入
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"></label>
                        <div class="col-sm-10">
                            <input type="text" name="options[3][name]"  placeholder="选项3"/>
                            <input type="radio" name="options[3][case]" value="0" checked>单行输入
                            <input type="radio" name="options[3][case]" value="1">多行输入
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"></label>
                        <div class="col-sm-10">
                            <a href="javascript:void(0)" class="btn btn-default btn-option-add">添加栏目</a>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right red" > 发布时间： </label>
                        <div class="col-sm-10">
                            <div class="col-xs-12 col-sm-3 hidden-xs btn-sespan">
                                <div class="input-group">
                                    <span class="input-group-addon">
                                        <i class="glyphicon glyphicon-calendar fa fa-calendar"></i>
                                    </span>
                                    <input type="text" name="createtime" class="sl-date" placeholder="点击选择日期范围" id="datetimepicker"/>    
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right red" for="form-field-1"> 封面图片上传： </label>
                        <div class="col-sm-10">
                            <a href="javascript:;" class="file">
                                <input type="file" name="smeta" id="file0" />
                                选择上传文件
                            </a>
                            <span class="lbl">&nbsp;&nbsp;<img src="__PUBLIC__/img/no_img.jpg" width="100" height="70" id="img0" ></span>&nbsp;&nbsp;<a href="javascript:;" onClick="return backpic('__PUBLIC__/img/no_img.jpg');" title="还原修改前的图片" class="file">
                            撤销上传
                        </a>
                        <span class="lbl">&nbsp;&nbsp;上传前先用PS处理成等比例图片后上传，最后都统一比例<br /></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 是否审核： </label>
                        <div class="col-sm-10" style="padding-top:5px;">
                            <input name="status" id="status" value="1" class="ace ace-switch ace-switch-4 btn-flat" type="checkbox"/>
                            <span class="lbl">&nbsp;&nbsp;默认关闭</span>
                        </div>
                    </div>
                    <div class="clearfix form-actions">
                        <div class="col-md-offset-3 col-md-9">
                            <button class="btn btn-info" type="submit"><i class="ace-icon fa fa-check bigger-110"></i>提交</button>&nbsp; &nbsp; &nbsp;
                            <button class="btn" type="reset"><i class="ace-icon fa fa-undo bigger-110"></i>重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{/block}
{block name="scripts"}
    <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/jquery.datetimepicker.css" />
    <script type="text/javascript" src="__PUBLIC__/sldate/moment.js"></script>
    <script type="text/javascript" src="__PUBLIC__/js/jquery.datetimepicker.full.min.js"></script>
    <script type="text/javascript">
        $.datetimepicker.setLocale('zh');
        $('#datetimepicker').datetimepicker({
            dayOfWeekStart : 1,
            lang:'zh',
            disabledDates:[],
            startDate:  ''
        });
        var num = 4;
        $('.btn-option-add').click(function(){
            var html = '<div class="form-group"><label class="col-sm-2 control-label no-padding-right"></label><div class="col-sm-10"><input type="text" name="options['+num+'][name]"  placeholder="选项'+num+'"/><input type="radio" name="options['+num+'][case]" value="0" checked>单行输入<input type="radio" name="options['+num+'][case]" value="1">多行输入</div></div>';
            $(this).closest('.form-group').before(html);
            num++;
        });
    </script>
{/block}
