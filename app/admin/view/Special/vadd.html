{extend name="Public/base" /}
{block name="main-content"}
    <div class="page-content">
        <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/jquery.datetimepicker.css" />
        <!--主题-->
        <div class="page-header">
            <h1>
                您当前操作
                <small>
                    <i class="ace-icon fa fa-angle-double-right"></i>
                    添加视频
                </small>
            </h1>
        </div>
        <div class="row">
            <div class="col-xs-12">
                <form class="form-horizontal ajaxForm2" name="form0" method="post" action="{:url('videoAdd')}" enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 视频标题： </label>
                        <div class="col-sm-10">
                            <input type="text" name="video_title" placeholder="必填：视频标题" class="col-xs-10 col-sm-6" required />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 视频链接： </label>
                        <div class="col-sm-10">
                            <input type="text" name="video_link" placeholder="必填：视频链接" class="col-xs-10 col-sm-6" required />
                            <span class="help-inline col-xs-12 col-sm-7"><span class="middle" id="resone"></span></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-1 control-label no-padding-right" for="form-field-1"> 描述 </label>
                        <div class="col-sm-10">
                            <script src="__PUBLIC__/ueditor/ueditor.config.js" type="text/javascript"></script>
                            <script src="__PUBLIC__/ueditor/ueditor.all.js" type="text/javascript"></script>
                            <textarea name="video_description" rows="100%" style="width:100%;height: 300px;" id="myEditor"></textarea>
                            <script type="text/javascript">
                                var editor = new UE.ui.Editor();
                                editor.render("myEditor");
                            </script>
                        </div>
                    </div>
                    
<!--                     <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right red" > 发布时间： </label>
                        <div class="col-sm-10">
                            <div class="col-xs-12 col-sm-3 hidden-xs btn-sespan">
                                <div class="input-group">
                                    <span class="input-group-addon">
                                        <i class="glyphicon glyphicon-calendar fa fa-calendar"></i>
                                    </span>
                                    <input type="text" name="createtime" class="sl-date" placeholder="点击选择日期范围" id="datetimepicker"/>    
                                </div>
                            </div>
                        </div>
                    </div> -->
<!--                     <div class="form-group">
                        <label class="col-sm-2 control-label no-padding-right"> 是否审核： </label>
                        <div class="col-sm-10" style="padding-top:5px;">
                            <input name="status" id="status" value="1" class="ace ace-switch ace-switch-4 btn-flat" type="checkbox"/>
                            <span class="lbl">&nbsp;&nbsp;默认关闭</span>
                        </div>
                    </div> -->
                    <div class="clearfix form-actions">
                        <div class="col-md-offset-3 col-md-9">
                            <button class="btn btn-info" type="submit"><i class="ace-icon fa fa-check bigger-110"></i>提交</button>&nbsp; &nbsp; &nbsp;
                            <button class="btn" type="reset"><i class="ace-icon fa fa-undo bigger-110"></i>重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{/block}
{block name="scripts"}
    <link rel="stylesheet" type="text/css" media="all" href="__PUBLIC__/css/jquery.datetimepicker.css" />
    <script type="text/javascript" src="__PUBLIC__/sldate/moment.js"></script>
    <script type="text/javascript" src="__PUBLIC__/js/jquery.datetimepicker.full.min.js"></script>
    <script type="text/javascript">
        $.datetimepicker.setLocale('zh');
        $('#datetimepicker').datetimepicker({
            dayOfWeekStart : 1,
            lang:'zh',
            disabledDates:[],
            startDate:  ''
        });
        $('.btn-option-add').click(function(){
            var html = '<div class="form-group"><input class="col-sm-2 control-label no-padding-right" name="other_name[]"/><div class="col-sm-10"><textarea name="other_ids[]" placeholder="必填：多个相关文章ID" class="col-xs-10 col-sm-6" ></textarea><span class="help-inline col-xs-12 col-sm-7"><span class="middle red" id="resone">英文逗号隔开</span></span></div></div>';
            $(this).closest('.form-group').before(html);
        });
    </script>
{/block}
