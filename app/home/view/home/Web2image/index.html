<body class="no-skin">

<div class="page-content" style="height: 100%">
	<!--主题-->
	<div class="page-header">
		<h1>
			您当前操作
			<small>
				<i class="ace-icon fa fa-angle-double-right"></i>长图片生成
			</small>
		</h1>
	</div>
	<div class="row">
		<div class="col-xs-12">
			<form class="form-horizontal ajaxForm2" name="form0" method="post" action="{:url('runadd')}" enctype="multipart/form-data">
				<div class="form-group">
					<label class="col-sm-1 control-label no-padding-right"> 标题 </label>
					<div class="col-sm-10">
						<input type="text" name="title" class="form-control">
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-1 control-label no-padding-right"> 主内容 </label>
					<div class="col-sm-10">
						<script src="/static/admin/ueditor/ueditor.config.js" type="text/javascript"></script>
						<script src="/static/admin/ueditor/ueditor.all.js" type="text/javascript"></script>
						<textarea name="post_content" rows="100%" style="width:100%;height: 300px;" id="myEditor"></textarea>
						<script type="text/javascript">
							var editor = new UE.ui.Editor();
							editor.render("myEditor");
						</script>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-1 control-label"> 二维码 </label>
					<div class="col-sm-10">
						<a href="javascript:;" class="file">
							<input type="file" name="img" id="file0">
							选择上传文件
						</a>
						<span class="lbl">&nbsp;&nbsp;<img src="/static/admin/img/no_img.jpg" width="100" height="100" id="img0"></span>&nbsp;&nbsp;<a href="javascript:;" onclick="return backpic('/static/admin/img/no_img.jpg');" title="还原修改前的图片" class="file">
						撤销上传
					</a>
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-1 control-label no-padding-right"> </label>
					<div class="col-sm-10">
						<input type="text" class="form-control" placeholder="字数限制0-15字" name="message_one" maxlength="15">
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-1 control-label no-padding-right">  </label>
					<div class="col-sm-10">
						<input type="text" class="form-control" placeholder="字数限制0-15字" name="message_two" maxlength="15">
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-1 control-label no-padding-right">  </label>
					<div class="col-sm-10">
						<input type="text" class="form-control" placeholder="字数限制0-15字" name="message_three" maxlength="15">
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-1 control-label no-padding-right">  </label>
					<div class="col-sm-10">
						备注：建议用户使用时，
						如果为一行的短文字，字体为微软雅黑，字号30点，颜色以黑色为主；
						如果为多行的长文字时，字体微软雅黑，字号20点，颜色以灰色为主；
						因为word编辑功能太强大，请在text中去格式，再在文本编辑器中
						编辑内容！！！
						技术人员无法控制您在文本编辑器编辑的内容和排版样式，请各位老师
						务必自己调整排版！！！
					</div>
				</div>


				<div class="space-4"></div>

				<div class="clearfix form-actions">
					<div class="col-md-offset-3 col-md-9">
						<button class="btn btn-info" type="submit">
							<i class="ace-icon fa fa-check bigger-110"></i>
							保存
						</button>&nbsp; &nbsp; &nbsp;
						<button class="btn" type="reset">
							<i class="ace-icon fa fa-undo bigger-110"></i>
							重置
						</button>
					</div>
				</div>

	<script>
		$.datetimepicker.setLocale('zh');
        $('#datetimepicker').datetimepicker({
            dayOfWeekStart : 1,
            lang:'zh',
            disabledDates:[],
            startDate:''
        });
		//多图设置
		$("#pic_list").hide();
		$("#news_pic_list").click(function(){
			$("#pic_list").hide();
		});
		$("#news_pic_qqlist").click(function(){
			$("#pic_list").show();
		});
		//跳转额外属性
		$("#pptaddress").hide();
		$("#news_flag_vaj").click(function(){
			$("#pptaddress").toggle(400);
		});
		$("#cpprice").hide();
		$("#news_flag_vacp").click(function(){
			$("#cpprice").toggle(400);
		});
