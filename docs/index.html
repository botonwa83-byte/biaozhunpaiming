<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta http-equiv=X-UA-Compatible content="IE=edge"><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script>
(function(){
  var DATA_BASE = (window.location.pathname.replace(/[^/]*$/, '')) + 'data/';
  var apiMap = {
    'getBrandList': 'brandList.json',
    'getRandList': 'randList.json',
    'getSearchBrandList': 'brandSearchResults.json',
    'getBannerlist': 'bannerList.json',
    'getArticleList': 'articleList.json',
    'loadVotes': 'votes.json',
    'loadSearchDetail': 'searchDetail.json',
    'getJdarticleList': 'JdarticleList.json',
    'getZxarticleList': 'ZxarticleList.json',
    'getJzarticleList': 'JzarticleList.json',
    'getYyarticleList': 'YyarticleList.json',
    'getSparticleList': 'SparticleList.json',
    'getQcarticleList': 'QcarticleList.json',
    'getCsarticleList': 'CsarticleList.json'
  };
  
  var dataCache = {};
  function loadDataFile(name){
    if(dataCache[name]) return Promise.resolve(dataCache[name]);
    return fetch(DATA_BASE + name, {cache: 'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ 
        dataCache[name] = d; 
        return d; 
      })
      .catch(function(e){
        console.warn('[API拦截] 加载失败 '+name+':', e);
        throw e;
      });
  }
  
  function matchApi(url){
    if(!url) return null;
    // 排除资源文件
    if(/\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|ttf)$/i.test(url)) return null;
    for(var key in apiMap){
      if(url.indexOf(key) !== -1){
        return apiMap[key];
      }
    }
    return null;
  }
  
  function buildApiResponse(file, url, body){
    return loadDataFile(file).then(function(d){
      // 搜索品牌特殊处理
      if(file === 'brandSearchResults.json'){
        var keyword = '';
        try {
          if(url && url.indexOf('keyword=') !== -1){
            keyword = decodeURIComponent(url.split('keyword=')[1].split('&')[0]);
          } else if(body){
            try {
              var parsed = typeof body === 'string' ? JSON.parse(body) : body;
              keyword = parsed.keyword || '';
            } catch(e){}
          }
        } catch(e){}
        if(keyword && d.all_brands){
          var kw = String(keyword).trim();
          var found = d.all_brands.find(function(b){
            return b.brand_name && String(b.brand_name).indexOf(kw) !== -1;
          });
          return {code: 200, msg: '获取成功', data: found || null};
        }
        return {code: 200, msg: '获取成功', data: null};
      }
      // 搜索详情（文章/投票）
      if(file === 'searchDetail.json'){
        var kw2 = '';
        var type = 'article';
        try {
          if(url){
            if(url.indexOf('keyword=') !== -1){
              kw2 = decodeURIComponent(url.split('keyword=')[1].split('&')[0]);
            }
            if(url.indexOf('type=') !== -1){
              type = url.split('type=')[1].split('&')[0];
            }
          }
          if(body){
            try {
              var p = typeof body === 'string' ? JSON.parse(body) : body;
              kw2 = p.keyword || kw2;
              type = p.type || type;
            } catch(e){}
          }
        } catch(e){}
        kw2 = String(kw2 || '').trim();
        var result = [];
        if(kw2){
          if(type === 'article' && d.all_articles){
            result = d.all_articles.filter(function(a){
              var t = String(a.post_title || a.post_excerpt || '');
              return t.indexOf(kw2) !== -1;
            }).slice(0, 20);
          }
        }
        return {status: 1, list: result, info: result.length ? 'ok' : '没有更多'};
      }
      return d;
    }).catch(function(){
      return {code: 200, msg: '获取成功', data: null};
    });
  }
  
  // ====== 拦截 fetch ======
  var origFetch = window.fetch;
  window.fetch = function(input, init){
    var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
    var file = matchApi(url);
    if(file){
      return buildApiResponse(file, url, init && init.body).then(function(respObj){
        var body = JSON.stringify(respObj);
        return new Response(body, {
          status: 200,
          statusText: 'OK',
          headers: {'Content-Type': 'application/json; charset=utf-8'}
        });
      });
    }
    return origFetch.apply(this, arguments);
  };
  
  // ====== 拦截 XMLHttpRequest (axios 使用这个) ======
  var origXHROpen = XMLHttpRequest.prototype.open;
  var origXHRSend = XMLHttpRequest.prototype.send;
  var origXHRSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
  
  XMLHttpRequest.prototype.open = function(method, url){
    this.__apiUrl = String(url || '');
    this.__apiHeaders = {};
    this.__apiMethod = method;
    // 如果是 API 请求，直接用相对路径防止 CORS/证书问题
    var file = matchApi(this.__apiUrl);
    if(file){
      this.__isApi = true;
    }
    return origXHROpen.apply(this, arguments);
  };
  
  XMLHttpRequest.prototype.setRequestHeader = function(name, value){
    if(this.__apiHeaders) this.__apiHeaders[name] = value;
    return origXHRSetRequestHeader.apply(this, arguments);
  };
  
  function fakeXHRResponse(xhr, obj){
    var respText = JSON.stringify(obj);
    try {
      // 模拟属性
      Object.defineProperty(xhr, 'readyState', {value: 4, configurable: true, writable: true});
      Object.defineProperty(xhr, 'status', {value: 200, configurable: true, writable: true});
      Object.defineProperty(xhr, 'statusText', {value: 'OK', configurable: true, writable: true});
      Object.defineProperty(xhr, 'responseText', {value: respText, configurable: true, writable: true});
      Object.defineProperty(xhr, 'response', {value: respText, configurable: true, writable: true});
      // 触发事件
      if(typeof xhr.onreadystatechange === 'function'){
        try { xhr.onreadystatechange.call(xhr); } catch(e){}
      }
      if(typeof xhr.onload === 'function'){
        try { xhr.onload.call(xhr); } catch(e){}
      }
      if(typeof xhr.onloadend === 'function'){
        try { xhr.onloadend.call(xhr); } catch(e){}
      }
      // 触发 readystatechange 事件
      try {
        var ev = document.createEvent('Event');
        ev.initEvent('readystatechange', false, false);
        xhr.dispatchEvent(ev);
        var lo = document.createEvent('Event');
        lo.initEvent('load', false, false);
        xhr.dispatchEvent(lo);
      } catch(e){}
    } catch(e) {
      console.warn('[API拦截] fakeXHRResponse error:', e);
    }
  }
  
  XMLHttpRequest.prototype.send = function(body){
    var self = this;
    if(self.__isApi){
      var file = matchApi(self.__apiUrl);
      if(file){
        buildApiResponse(file, self.__apiUrl, body).then(function(respObj){
          fakeXHRResponse(self, respObj);
        });
        return;
      }
    }
    // 如果请求是 biaozhunpaiming.com 域名但证书有问题，也尝试拦截
    if(self.__apiUrl && self.__apiUrl.indexOf('biaozhunpaiming') !== -1){
      var f2 = matchApi(self.__apiUrl);
      if(f2){
        buildApiResponse(f2, self.__apiUrl, body).then(function(respObj){
          fakeXHRResponse(self, respObj);
        });
        return;
      }
    }
    return origXHRSend.apply(this, arguments);
  };
  
  console.log('[API拦截器] 已初始化，数据基础路径:', DATA_BASE);
})();
