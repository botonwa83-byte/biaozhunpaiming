(function(){
  var DATA_BASE = './data/';
  var apiMap = {
    'getBrandList': 'brandList.json',
    'getRandList': 'randList.json',
    'getSearchBrandList': 'searchBrandList.json',
    'getBannerlist': 'bannerList.json',
    'getArticleList': 'articleList.json',
    'loadVotes': 'votes.json',
    'getJdarticleList': 'JdarticleList.json',
    'getZxarticleList': 'ZxarticleList.json',
    'getJzarticleList': 'JzarticleList.json',
    'getYyarticleList': 'YyarticleList.json',
    'getSparticleList': 'SparticleList.json',
    'getQcarticleList': 'QcarticleList.json',
    'getCsarticleList': 'CsarticleList.json'
  };
  
  var dataCache = {};
  function loadDataFile(name){
    if(dataCache[name]) return Promise.resolve(dataCache[name]);
    return fetch(DATA_BASE + name)
      .then(function(r){ return r.json(); })
      .then(function(d){ 
        dataCache[name] = d; 
        return d; 
      });
  }
  
  function matchApi(url){
    for(var key in apiMap){
      if(url.indexOf(key) !== -1){
        return apiMap[key];
      }
    }
    return null;
  }
  
  function makeResponse(data){
    return Promise.resolve({
      data: data,
      status: 200,
      statusText: 'OK',
      headers: {},
      config: {}
    });
  }
  
  function interceptRequest(url, options){
    var file = matchApi(url);
    if(file){
      return loadDataFile(file).then(function(d){
        // 搜索特殊处理
        if(file === 'searchBrandList.json'){
          var keyword = '';
          try {
            if(url.indexOf('keyword=') !== -1){
              keyword = decodeURIComponent(url.split('keyword=')[1].split('&')[0]);
            } else if(options && options.body){
              var body = typeof options.body === 'string' ? JSON.parse(options.body) : options.body;
              keyword = body.keyword || '';
            }
          } catch(e){}
          if(keyword && d.all_brands){
            var found = d.all_brands.find(function(b){
              return b.brand_name && b.brand_name.indexOf(keyword) !== -1;
            });
            return makeResponse({code: 200, msg: '获取成功', data: found || null});
          }
          return makeResponse({code: 200, msg: '获取成功', data: null});
        }
        return makeResponse(d);
      }).catch(function(e){
        console.warn('加载静态数据失败:', file, e);
        return makeResponse({code: 200, msg: '获取成功', data: null});
      });
    }
    return null;
  }
  
  // 拦截 fetch
  var origFetch = window.fetch;
  window.fetch = function(input, init){
    var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
    var result = interceptRequest(url, init || {});
    if(result){
      return result.then(function(resp){
        return new Response(JSON.stringify(resp.data), {
          status: 200,
          headers: {'Content-Type': 'application/json'}
        });
      });
    }
    return origFetch.apply(this, arguments);
  };
  
  // 拦截 axios (XMLHttpRequest)
  var origXHROpen = XMLHttpRequest.prototype.open;
  var origXHRSend = XMLHttpRequest.prototype.send;
  var origXHRSetHeader = XMLHttpRequest.prototype.setRequestHeader;
  
  XMLHttpRequest.prototype.open = function(method, url){
    this._requestUrl = url;
    this._requestMethod = method;
    return origXHROpen.apply(this, arguments);
  };
  
  XMLHttpRequest.prototype.send = function(body){
    var self = this;
    var result = interceptRequest(this._requestUrl || '', {body: body});
    if(result){
      result.then(function(resp){
        try {
          Object.defineProperty(self, 'readyState', {value: 4, writable: true});
          Object.defineProperty(self, 'status', {value: 200, writable: true});
          Object.defineProperty(self, 'responseText', {value: JSON.stringify(resp.data), writable: true});
          Object.defineProperty(self, 'response', {value: JSON.stringify(resp.data), writable: true});
          if(self.onreadystatechange) self.onreadystatechange.call(self);
          if(self.onload) self.onload.call(self);
        } catch(e){
          setTimeout(function(){
            origXHRSend.call(self, body);
          }, 0);
        }
      });
      return;
    }
    return origXHRSend.apply(this, arguments);
  };
})();
